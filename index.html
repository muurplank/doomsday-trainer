<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doomsday trainer</title>
<style>
  :root {
    --bg: #f6f4ef; --card: #ffffff; --ink: #1d1c1a; --muted: #6d6a63; --line: #e2ded4;
    --accent: #3f4bd1; --accent-ink: #ffffff; --accent-soft: #e6e8fb;
    --good: #1f8a4c; --good-soft: #def3e5; --bad: #c0392b; --bad-soft: #fbe3df;
    --gold: #b7791f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15161a; --card: #1f2127; --ink: #eceae4; --muted: #9a978f; --line: #30333c;
      --accent: #8b95ff; --accent-ink: #12131a; --accent-soft: #2a2e52;
      --good: #5fd08c; --good-soft: #1d3a29; --bad: #ff8577; --bad-soft: #45231f;
      --gold: #e6b655;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 28px 16px 60px; }
  h1 { font-size: 28px; margin: 0 0 4px; letter-spacing: -0.02em; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 28px 0 10px; }
  p { margin: 0 0 10px; }
  .muted { color: var(--muted); }
  button { font: inherit; color: inherit; cursor: pointer; }
  .btn { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 9px 16px; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  .btn.link { border: 0; background: none; padding: 4px 0; color: var(--muted); text-decoration: underline; }

  .top { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--card); }
  .seg button { border: 0; background: none; padding: 7px 12px; font-size: 14px; }
  .seg button.on { background: var(--accent); color: var(--accent-ink); }

  .next { margin-top: 20px; background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px 18px; display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
  .card { text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px;
    display: flex; flex-direction: column; gap: 6px; min-height: 132px; }
  .card:hover { border-color: var(--accent); }
  .card .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .card .num { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .card .title { font-weight: 650; font-size: 17px; }
  .card .desc { font-size: 14px; color: var(--muted); flex: 1; }
  .card .fclink { font-size: 13px; color: var(--accent); border-radius: 8px; padding: 2px 6px; margin: -2px -6px; }
  .card .fclink:hover { background: var(--accent-soft); }
  .fc { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 30px 20px 24px; text-align: center; cursor: pointer; min-height: 300px; }
  .fc .fcback { margin: 14px auto 0; max-width: 460px; text-align: left; background: var(--bg); border-radius: 12px; padding: 12px 14px; }
  .fc .ans { font-size: 40px; font-weight: 700; color: var(--accent); text-align: center; margin: 6px 0 2px; }
  .fcmix { display: flex; align-items: center; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 0 0 12px; font-size: 13px; color: var(--muted); }
  .fclist { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 8px; }
  .fclist td, .fclist th { padding: 5px 8px; border-bottom: 1px solid var(--line); text-align: left; font-variant-numeric: tabular-nums; }
  .fclist th { color: var(--muted); font-weight: 500; font-size: 12px; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .badge.done { background: var(--good-soft); color: var(--good); border-color: transparent; }
  .badge.busy { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
  .combo { font-size: 11px; color: var(--gold); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
  .dots { display: flex; gap: 4px; }
  .dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
  .dots i.ok { background: var(--good); } .dots i.no { background: var(--bad); }

  .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .stats { display: flex; gap: 18px; align-items: center; font-size: 14px; color: var(--muted); flex-wrap: wrap; }
  .stats b { color: var(--ink); font-variant-numeric: tabular-nums; }
  details.uitleg { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; margin-bottom: 14px; }
  details.uitleg summary { cursor: pointer; font-weight: 600; }
  details.uitleg .body { margin-top: 10px; font-size: 15px; }
  details.uitleg ul { margin: 6px 0 10px; padding-left: 20px; }
  table.t { border-collapse: collapse; margin: 8px 0 10px; font-variant-numeric: tabular-nums; }
  table.t td, table.t th { border: 1px solid var(--line); padding: 4px 10px; text-align: center; font-size: 14px; }
  table.t th { color: var(--muted); font-weight: 500; }
  .scroll { overflow-x: auto; }

  .quiz { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 30px 20px 24px; text-align: center; }
  .tag { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; min-height: 18px; }
  .ask { font-size: 15px; color: var(--muted); margin-top: 4px; }
  .big { font-size: clamp(34px, 8vw, 56px); font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; margin: 6px 0 2px; line-height: 1.15; }
  .big.gone { color: transparent; position: relative; }
  .big.gone::after { content: '• • •'; position: absolute; inset: 0; color: var(--line); }
  .big.gone.peek { color: inherit; }
  .big.gone.peek::after { content: none; }
  .small { font-size: 15px; color: var(--muted); min-height: 22px; }
  .choices { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 22px; }
  .choices button { min-width: 64px; padding: 12px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); font-size: 17px; }
  .choices button:hover:not(:disabled) { border-color: var(--accent); }
  .choices button b { font-size: 19px; }
  .choices button.right { background: var(--good-soft); border-color: var(--good); color: var(--good); }
  .choices button.wrong { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
  .choices button:disabled { cursor: default; }
  form.num { display: flex; justify-content: center; gap: 8px; margin-top: 22px; }
  form.num input { width: 120px; font: inherit; font-size: 24px; text-align: center; padding: 8px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  form.num input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .fb { margin-top: 20px; min-height: 96px; }
  /* Vraag links, uitwerking van de vorige vraag rechts (op smalle schermen eronder) */
  main:has(.quizwrap) { max-width: 1180px; }
  .quizwrap { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
  @media (max-width: 860px) { .quizwrap { grid-template-columns: 1fr; } }
  .prev { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; font-size: 15px; }
  .prev h3 { margin: 0 0 8px; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .prev .pq { color: var(--muted); font-size: 14px; }
  .prev .pbig { font-size: 22px; font-weight: 700; margin: 2px 0 6px; font-variant-numeric: tabular-nums; }
  .prev .pres { font-weight: 600; margin-bottom: 8px; }
  .prev .pres.ok { color: var(--good); } .prev .pres.no { color: var(--bad); }
  .prev .why { background: var(--bg); border-radius: 12px; padding: 10px 12px; }
  .prev .why div + div { margin-top: 3px; }
  .fb .verdict { font-weight: 700; font-size: 18px; }
  .fb.ok .verdict { color: var(--good); } .fb.no .verdict { color: var(--bad); }
  .fb .why { margin: 8px auto 12px; max-width: 560px; font-size: 15px; text-align: left; background: var(--bg);
    border-radius: 12px; padding: 10px 14px; font-variant-numeric: tabular-nums; }
  .fb .why div + div { margin-top: 3px; }
  .calc { display: grid; grid-template-columns: max-content 2.2em 1fr; gap: 3px 14px; align-items: baseline; margin: 4px 0; }
  .calc span { color: var(--muted); font-size: 14px; }
  .calc > b { font-size: 21px; text-align: right; line-height: 1.25; }
  .calc i { font-style: normal; color: var(--muted); font-size: 14px; }
  .calc .sum { border-top: 1px solid var(--line); padding-top: 5px; margin-top: 3px; align-self: stretch; }
  .calc .res { font-size: 21px; color: var(--accent); }
  .calc .hd { grid-column: 1 / -1; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-top: 8px; }
  .calc .hd:first-child { margin-top: 0; }
  .calc .anc { color: var(--gold); }
  .hint { font-size: 13px; color: var(--muted); margin-top: 14px; }
  .banner { background: var(--good-soft); color: var(--good); border-radius: 14px; padding: 12px 16px; margin-bottom: 14px;
    display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; font-weight: 600; }
  kbd { font: inherit; font-size: 12px; border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; background: var(--bg); }
  footer { margin-top: 34px; font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
</style>
</head>
<body>
<main id="app"></main>

<script id="logic">
// ---------- Pure doomsday-logica ----------
const DAYS = ['zondag','maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag'];
const DS = ['zo','ma','di','wo','do','vr','za'];
const MONTHS = ['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
const mod = (n, m) => ((n % m) + m) % m;
const isLeap = y => (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;
const centuryAnchor = c => [2, 0, 5, 3][mod(c, 4)];
function yyParts(yy) {
  const q = Math.floor(yy / 12), r = yy % 12, f = Math.floor(r / 4), total = q + r + f;
  return { yy, q, r, f, total, off: total % 7 };
}
function yearParts(y) {
  const c = Math.floor(y / 100), anchor = centuryAnchor(c), p = yyParts(y % 100);
  return { ...p, c, anchor, dd: (anchor + p.off) % 7 };
}
const monthAnchor = (m, leap) => [leap ? 4 : 3, leap ? 29 : 28, 14, 4, 9, 6, 11, 8, 5, 10, 7, 12][m - 1];
const daysIn = (m, leap) => [31, leap ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][m - 1];
const weekdayOf = (y, m, d) => mod(yearParts(y).dd + d - monthAnchor(m, isLeap(y)), 7);
</script>

<script>
// ---------- Hulpjes ----------
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[rnd(0, arr.length - 1)];
function wpick(items, weights) {
  let t = weights.reduce((a, b) => a + b, 0) * Math.random();
  for (let i = 0; i < items.length; i++) { t -= weights[i]; if (t < 0) return items[i]; }
  return items[items.length - 1];
}
const cap = s => s[0].toUpperCase() + s.slice(1);
const dayLabel = i => `<b>${DAYS[i]}</b> (${i})`;

const C_WEEK = DAYS.map((d, i) => ({ v: i, label: `<b>${i}</b> ${DS[i]}`, key: String(i) }));
const C_07 = [0,1,2,3,4,5,6].map(i => ({ v: i, label: `<b>${i}</b>`, key: String(i) }));
const C_08 = [0,1,2,3,4,5,6,7,8].map(i => ({ v: i, label: `<b>${i}</b>`, key: String(i) }));
const C_NAMES = DAYS.map((d, i) => ({ v: i, label: cap(d) }));
const C_YN = [{ v: 1, label: '<b>Ja</b> <kbd>J</kbd>', key: 'j' }, { v: 0, label: '<b>Nee</b> <kbd>N</kbd>', key: 'n' }];

// ---------- Opslag ----------
const KEY = 'doomsday-trainer-v1';
let S = { levels: {}, range: 'wide' };
try { S = Object.assign(S, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
// Via start.command (server.py) gaat alles direct naar schijf; als los bestand geopend blijft het in de browser.
const SERVER = typeof location !== 'undefined' && ['localhost', '127.0.0.1'].includes(location.hostname);

// GitHub-opslag: log + voortgang in een (privé) repo, zodat het op elk apparaat hetzelfde is.
const DEFAULT_REPO = 'muurplank/doomsday-data';
const GHKEY = 'doomsday-trainer-gh';
const HEADER = ['Timestamp', 'Onderdeel', 'Bron', 'Vraag', 'Antwoord', 'Juist antwoord', 'Goed', 'Tijd (s)'];
const csvCell = v => /[",\n;]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : String(v);
const csvRow = r => r.map(csvCell).join(',');
let GH = null;
try { GH = JSON.parse(localStorage.getItem(GHKEY)); } catch (e) {}
let stateDirty = false, flushing = false, flushTimer = null, syncErr = null;
const b64e = s => { let o = ''; for (const x of new TextEncoder().encode(s)) o += String.fromCharCode(x); return btoa(o); };
const b64d = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g, '')), ch => ch.charCodeAt(0)));
const ghErr = st => new Error(st === 401 ? 'token ongeldig of verlopen' : st === 404 || st === 403 ? 'geen toegang tot de repo' : 'GitHub-fout ' + st);
function ghFetch(url, opt = {}) {
  return fetch('https://api.github.com/repos/' + GH.repo + url, { ...opt, cache: 'no-store',
    headers: { Authorization: 'Bearer ' + GH.token, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' } });
}
async function ghRead(path) {
  const r = await ghFetch('/contents/' + path);
  if (r.status === 404) return { text: null, sha: null };
  if (!r.ok) throw ghErr(r.status);
  const j = await r.json();
  return { text: b64d(j.content), sha: j.sha };
}
async function ghWrite(path, text, sha, message) {
  const r = await ghFetch('/contents/' + path, { method: 'PUT', body: JSON.stringify({ message, content: b64e(text), ...(sha ? { sha } : {}) }) });
  if (!r.ok) throw ghErr(r.status);
}
const syncText = () => !GH ? '' : syncErr ? `⚠ niet gesynct: ${syncErr}` : (LOG.length || stateDirty) ? `↑ ${LOG.length} te versturen` : '✓ opgeslagen op GitHub';
function updateSync() { const el = document.getElementById('sync'); if (el) el.textContent = syncText(); }
function scheduleFlush(ms = 20000) { if (GH && !flushTimer) flushTimer = setTimeout(() => { flushTimer = null; flush(); }, ms); updateSync(); }
async function flush() {
  if (!GH || flushing) return;
  flushing = true;
  try {
    const byMonth = {};
    LOG.slice().forEach(r => (byMonth[r[0].slice(0, 7)] ||= []).push(r));
    for (const m in byMonth) {
      const path = `doomsday_log_${m}.csv`, f = await ghRead(path);
      await ghWrite(path, (f.text ?? HEADER.join(',') + '\n') + byMonth[m].map(csvRow).join('\n') + '\n', f.sha, `log: ${byMonth[m].length} pogingen`);
      LOG = LOG.filter(r => !byMonth[m].includes(r));
      try { localStorage.setItem(LOGKEY, JSON.stringify(LOG)); } catch (e) {}
    }
    if (stateDirty) {
      stateDirty = false;
      try { const f = await ghRead('voortgang.json'); await ghWrite('voortgang.json', JSON.stringify(S), f.sha, 'voortgang'); }
      catch (e) { stateDirty = true; throw e; }
    }
    syncErr = null;
  } catch (e) { syncErr = e.message || 'geen verbinding'; }
  flushing = false;
  if (LOG.length || stateDirty) scheduleFlush(syncErr ? 60000 : 20000);
  updateSync();
}
async function ghConnect(repo, token) {
  GH = { repo, token };
  const r = await ghFetch('').catch(() => null);
  if (!r || !r.ok) { GH = null; throw r ? ghErr(r.status) : new Error('geen verbinding'); }
  localStorage.setItem(GHKEY, JSON.stringify(GH));
}
const post = (url, data) => fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) })
  .then(r => { if (!r.ok) throw new Error(r.status); });
let diskOk = SERVER;
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  if (GH) { stateDirty = true; scheduleFlush(); } else if (SERVER) post('/state', S).catch(() => {}); };
// Logboek: elke poging als rij, te downloaden als CSV
const LOGKEY = 'doomsday-trainer-log-v1';
let LOG = [];
try { LOG = JSON.parse(localStorage.getItem(LOGKEY) || '[]'); } catch (e) {}
const pad2 = n => String(n).padStart(2, '0');
const stamp = (d = new Date()) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
const plain = s => String(s).replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim();
const keepLocal = row => { LOG.push(row); try { localStorage.setItem(LOGKEY, JSON.stringify(LOG)); } catch (e) {} };
function logAttempt(row) {
  if (GH) { keepLocal(row); return scheduleFlush(); }
  if (!SERVER) return keepLocal(row);
  post('/log', row).then(() => { diskOk = true; }).catch(() => { diskOk = false; keepLocal(row); warnDisk(); });
}
function warnDisk() {
  const b = document.getElementById('banner');
  if (b && !b.querySelector('.err')) b.insertAdjacentHTML('afterbegin',
    '<div class="banner err" style="background:var(--bad-soft);color:var(--bad)">Kan niet naar doomsday_log.csv schrijven — draait start.command nog? Pogingen worden zolang in de browser bewaard.</div>');
}
function downloadCsv() {
  const csv = [HEADER, ...LOG].map(csvRow).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `doomsday_log_${stamp().slice(0, 10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
}
const L = id => (S.levels[id] ||= { hist: [], total: 0, correct: 0 });
const recent = id => L(id).hist.slice(-10);

// ---------- Tempo: wat je traag of fout doet komt vaker terug (zoals "Op tempo" in de landenquiz) ----------
// Elke vraag bestaat uit een of meer bouwstenen (q.parts, bijv. de maand en het jaardeel van een datum).
// Per bouwsteen houden we bij hoe traag je bent t.o.v. je eigen gewone tempo in dat onderdeel:
// r = ln(tijd) − ln(basistempo), begrensd op [−0,8; 1,0]; een fout telt als 1,2. Alleen de eerste keer per
// sessie telt volledig (een herhaling meet vooral je kortetermijngeheugen). De volgende vraag wordt gewogen
// getrokken: het traagste komt hooguit ~5× zo vaak als het snelste, en wat je lang niet zag komt vanzelf terug.
const TP = { rLo: -0.8, rHi: 1.0, rErr: 1.2, n0: 2, aMin: 0.2, nMax: 20, beta: 0.4, c: 0.12, R: 5, eta: 0.05, warm: 5, cands: 24 };
const LAMBDA = Math.log(TP.R) / 2;
const clip = (x, a, b) => Math.min(b, Math.max(a, x));
const today = () => Math.floor(Date.now() / 864e5);
const stale = d => Math.min(0.8, TP.c * Math.log2(1 + Math.max(0, d)));
const partKeys = (lid, q) => (q.parts || [q.key]).map(p => `${lid}|${p}`);
const baseKey = (lid, q) => `${lid}|${q.choices ? 'k' + q.choices.length : 'typ'}`;
// Opslag compact: S.tempo[item] = [m×100, n×10, dag], S.tbase[context] = [B×1000, n]
const getItem = k => { const v = (S.tempo ||= {})[k]; return v ? { m: v[0] / 100, n: v[1] / 10, day: v[2] } : { m: 0, n: 0, day: null }; };
const putItem = (k, it) => { S.tempo[k] = [Math.round(it.m * 100), Math.round(it.n * 10), it.day]; };
function need(k) {
  const it = getItem(k);
  if (!it.n) return TP.beta;
  return it.m + stale(today() - it.day) + TP.beta / Math.sqrt(it.n + 1);
}
// Bij meerdere bouwstenen telt de traagste het zwaarst (half gemiddelde, half maximum)
const weightOf = keys => { const ns = keys.map(need), avg = ns.reduce((a, x) => a + x, 0) / ns.length;
  return Math.exp(LAMBDA * clip((avg + Math.max(...ns)) / 2, -1, 1)); };

/** Kies uit een stel gegenereerde vragen, gewogen naar hoe traag je de bouwstenen weet. */
function tempoPick(c) {
  const cands = [];
  for (let i = 0; i < TP.cands; i++) {
    const q = c.lvl.gen(); if (q.key === c.lastKey) continue;
    const keys = partKeys(q.lid || c.lvl.id, q);
    // Een net gestelde vraag even niet, daarna langzaam weer meedoen
    const qk = 'Q' + (q.lid || c.lvl.id) + q.key, gap = c.seen.has(qk) ? c.n - c.seen.get(qk) : 99;
    const f = gap <= 1 ? 0.05 : 1 - Math.exp(-(gap - 1) / 3);
    cands.push([q, weightOf(keys) * f]);
  }
  if (!cands.length) return c.lvl.gen();
  let u = Math.random() * cands.reduce((a, x) => a + x[1], 0);
  for (const [q, w] of cands) { u -= w; if (u <= 0) return q; }
  return cands[cands.length - 1][0];
}

/** Verwerk een antwoord (t in seconden). */
function tempoUpdate(c, q, ok, t) {
  const lid = q.lid || c.lvl.id, keys = partKeys(lid, q);
  const cold = keys.map(k => !c.seen.has(k));
  keys.forEach(k => c.seen.set(k, c.n)); c.seen.set('Q' + lid + q.key, c.n);
  if (t < 0.25 || c.hidden) return;            // mis-klik of tabblad weg geweest: niets boeken
  let r;
  if (!ok) r = TP.rErr;
  else {
    const bk = baseKey(lid, q), lt = Math.log(t), b = (S.tbase ||= {})[bk] || [Math.round(lt * 1000), 0];
    let B = b[0] / 1000, n = b[1];
    if (t > Math.max(30, 6 * Math.exp(B))) return;   // afgeleid, telt niet
    B = n < TP.warm ? (B * n + lt) / (n + 1) : B + TP.eta * clip(lt - B, -1, 1);
    S.tbase[bk] = [Math.round(B * 1000), Math.min(n + 1, 999)];
    r = clip(lt - B, TP.rLo, TP.rHi);
  }
  const share = 1 / Math.sqrt(keys.length), d = today();
  keys.forEach((k, i) => {
    const it = getItem(k);
    const w = share * (cold[i] ? 1 : 0.3);
    const rAdj = r - (it.day == null ? 0 : stale(d - it.day));
    const a = Math.max(1 / (it.n + TP.n0), TP.aMin);
    it.m += a * w * (rAdj - it.m);
    it.n = Math.min(TP.nMax, it.n + w);
    if (cold[i] || it.day == null) it.day = d;
    putItem(k, it);
  });
}

function start(id) {
  cur = { lvl: byId(id), q: null, t0: 0, state: 'ask', streak: 0, n: 0, retry: [], lastKey: null, seen: new Map(), hidden: false, wasMastered: mastered(id), banner: false, timer: null };
  const l = cur.lvl;
  app.innerHTML = `
    <div class="bar"><button class="btn" id="back">← Overzicht</button>
      <div class="stats"><span>Reeks <b id="streak">0</b></span><span id="dots"></span><span>Gem. <b id="avg">–</b></span><span id="sync" style="font-size:12px"></span></div><span style="display:flex;gap:8px;flex-wrap:wrap"><span id="diffseg">${diffSeg()}</span><span id="orderseg">${orderSeg()}</span><span style="display:inline-flex;gap:6px;align-items:center"><span class="muted" style="font-size:13px">Getal in beeld</span><span id="flashseg">${flashSeg()}</span></span></span></div>
    <div id="banner"></div>

    <div class="hint">Toetsenbord: typ het antwoord · na het antwoord: elke toets of klik = volgende vraag · <kbd>Esc</kbd> terug naar het overzicht · <kbd>Q</kbd> vasthouden = getal weer tonen<br><b>Op tempo</b>: wat je traag of fout doet komt vaker terug, ook in volgende sessies.</div>`;
  ask();
}

function ask() {
  const c = cur; clearTimeout(c.timer);
  c.n++;
  const due = c.retry.findIndex(r => r.due <= c.n);
  if (due >= 0) c.q = c.retry.splice(due, 1)[0].q;
  else if (TEMPO()) c.q = tempoPick(c);
  else { let q, tries = 0; do { q = c.lvl.gen(); } while (q.key === c.lastKey && ++tries < 6); c.q = q; }
  c.lastKey = c.q.key; c.state = 'ask'; c.hidden = false;
  const q = c.q;
  if (c.prev) { const p = c.prev, pq = p.q;
    document.getElementById('prev').innerHTML = `<h3>Vorige vraag</h3>
      <div class="pq">${pq.tag ? pq.tag + ' · ' : ''}${pq.ask}</div><div class="pbig">${pq.big}${pq.small ? ` <span class="muted" style="font-size:14px;font-weight:400">(${pq.small})</span>` : ''}</div>
      <div class="pres ${p.ok ? 'ok' : 'no'}">${p.ok ? `✓ ${pq.show}` : `✗ jij: ${p.mine} — goed: ${pq.show}`} <span class="muted" style="font-weight:400;font-size:13px">· ${p.t.toFixed(1)} s</span></div>
      <div class="why">${pq.why}</div>`; }
  document.getElementById('quiz').innerHTML = `
    <div class="tag">${q.tag || ''}</div><div class="ask">${q.ask}</div><div class="big">${q.big}</div><div class="small">${q.small || ''}</div>
    ${q.choices
      ? `<div class="choices">${q.choices.map(ch => `<button data-v="${ch.v}">${ch.label}</button>`).join('')}</div>`
      : `<form class="num" id="numform"><input id="num" inputmode="numeric" autocomplete="off" maxlength="3"><button class="btn primary">OK</button></form>`}
    <div class="fb" id="fb"></div>`;
  const inp = document.getElementById('num'); if (inp) inp.focus();
  refreshStats();
  c.t0 = performance.now();
  clearTimeout(c.flashTimer);
  if (FLASH()) c.flashTimer = setTimeout(() => { if (cur === c && c.state === 'ask') document.querySelector('#quiz .big').classList.add('gone'); }, FLASH() * 1000);
}

function answer(v) {
  const c = cur, q = c.q; if (!c || c.state !== 'ask') return;
  const t = (performance.now() - c.t0) / 1000, ok = q.check ? q.check(v) : v === q.answer;
  c.state = 'fb';
  clearTimeout(c.flashTimer);
  const big = document.querySelector('#quiz .big'); if (big) big.classList.remove('gone');   // na het antwoord weer tonen
  const st = L(c.lvl.id);
  st.total++; if (ok) st.correct++;
  st.hist.push({ ok, t: Math.round(t * 10) / 10 }); if (st.hist.length > 50) st.hist.shift();
  tempoUpdate(c, q, ok, t);
  save();
  logAttempt([stamp(), c.lvl.title, q.tag || c.lvl.title, plain(`${q.ask} ${q.big}${q.small ? ` (${q.small})` : ''}`),
    q.choices ? plain((q.choices.find(ch => ch.v === v) || {}).label || v).replace(/ [JN]$/, '') : v, plain(q.show), ok ? 'Ja' : 'Nee', t.toFixed(2)]);
  c.streak = ok ? c.streak + 1 : 0;
  c.prev = { q, ok, t, mine: q.choices ? plain((q.choices.find(ch => ch.v === v) || {}).label || v).replace(/ [JN]$/, '') : v };
  if (!ok) c.retry.push({ q, due: c.n + rnd(3, 5) });
  document.querySelectorAll('.choices button').forEach(b => {
    b.disabled = true;
    if (+b.dataset.v === q.answer) b.classList.add('right'); else if (+b.dataset.v === v) b.classList.add('wrong');
  });
  const inp = document.getElementById('num'); if (inp) inp.disabled = true;
  const fb = document.getElementById('fb');
  fb.className = 'fb ' + (ok ? 'ok' : 'no');
  fb.innerHTML = `<div class="verdict">${ok ? '✓ Goed' : `✗ Fout — het is ${q.show}`} <span class="muted" style="font-weight:400;font-size:14px">· ${t.toFixed(1)} s</span></div>
    <div class="why">${q.why}</div>${!ok ? '<button class="btn primary" id="nextq">Volgende (klik of druk op een toets)</button>' : ''}`;
  refreshStats();
  if (!c.wasMastered && mastered(c.lvl.id)) { c.wasMastered = true; c.banner = true; showBanner(); }
  // Goed: na 0,75 s door. Fout: blijft staan tot je klikt of een toets indrukt, zodat je de uitleg kunt lezen.
  if (ok) c.timer = setTimeout(() => { if (cur === c && c.state === 'fb') ask(); }, 750);
}

// ---------- Flashcards: de 20 moeilijkste bouwstenen van een onderdeel ----------
// Gesorteerd op de tempo-score (traag of fout t.o.v. je eigen tempo). Flashcards veranderen die score niet:
// alleen echte quizvragen tellen, dus de lijst schuift pas als je het in de quiz sneller/goed doet.
const FC_LEVELS = ['jaardeel', 'jaar', 'offset', 'datum'];
let fc = null;
function hardest(lid, n = 20) {
  return Object.keys(S.tempo || {}).filter(k => k.startsWith(lid + '|')).map(k => ({ k, part: k.slice(lid.length + 1), it: getItem(k) }))
    .filter(x => x.it.n > 0).sort((a, b) => b.it.m - a.it.m).slice(0, n);
}
/** Voor- en achterkant van een bouwsteen. */
function cardOf(part) {
  let m;
  if ((m = /^y(\d+)$/.exec(part))) { const p = yyParts(+m[1]), yy = `'${m[1].padStart(2, '0')}`;
    return { kind: 'Jaardeel', front: yy, short: yy, ask: 'Wat is het jaardeel (0–6) van', ans: p.off, back: whyYY(p) }; }
  if ((m = /^c(\d+)$/.exec(part))) { const a = centuryAnchor(+m[1]);
    return { kind: 'Eeuw-anker', front: `${m[1]}00`, short: `${m[1]}00`, ask: 'Wat is het anker van de eeuw', ans: `${a} <span style="font-size:20px">${DAYS[a]}</span>`, back: `<div>Rijtje 2 – 0 – 5 – 3 vanaf ${m[1] - mod(+m[1], 4)}00 → ${m[1]}00 = ${dayLabel(a)}</div>` }; }
  if ((m = /^m(\d+)(true|false)?$/.exec(part))) { const mo = +m[1], leap = m[2] === 'true', a = monthAnchor(mo, leap);
    const extra = m[2] ? (leap ? ' (schrikkeljaar)' : ' (geen schrikkeljaar)') : '';
    return { kind: 'Maand-doomsday', front: cap(MONTHS[mo - 1]) + extra, short: MONTHS[mo - 1] + extra, ask: 'Welke datum is een doomsday in', ans: a, back: `<div>${cap(MONTHS[mo - 1])}: <b>${a}</b> — ${MNEMO[mo - 1]}</div>` }; }
  if ((m = /^k(-?\d+)$/.exec(part))) { const d = +m[1], o = mod(d, 7);
    return { kind: 'Afstand', front: `${d >= 0 ? '+' : '−'}${Math.abs(d)} dagen`, short: `${d >= 0 ? '+' : '−'}${Math.abs(d)} dagen`, ask: 'Datum min doomsday-datum is', ans: o,
      back: `<div>${d} → mod 7 = <b>${o}</b>: ${o} dag${o === 1 ? '' : 'en'} na de doomsday${o ? ` (of ${7 - o} ervoor)` : ' (zelfde weekdag)'}</div>` }; }
  return null;
}
const tableCards = () => [
  ...DOZENS.map(d => ({ k: 'tz' + d, card: { kind: 'Twaalftal', ask: 'Waarde van het twaalftal', front: String(d), short: `twaalftal ${d}`, ans: dozenVal(d),
    back: `<div>${d} = <b>${d / 12}</b> × 12${d / 12 >= 7 ? ` → ${d / 12} − 7 = <b>${dozenVal(d)}</b>` : ''}</div>` } })),
  ...[...Array(14).keys()].map(x => { const f = Math.floor(x / 4), t = x + f;   // rest 12 en 13 komen niet echt voor, maar als controle: = één twaalftal extra
    return { k: 'tr' + x, card: { kind: 'Rest', ask: 'Waarde van de rest (rest + vieren)', front: `rest ${x}`, short: `rest ${x}`, ans: restVal(x),
      back: `<div>${x} + ${f} <span class="muted">(4 past ${f}× in ${x})</span> = ${t}${t >= 7 ? ` → − 7 = <b>${restVal(x)}</b>` : ''}</div>
        <div class="muted" style="margin-top:6px">${x >= 12 ? `Rest ${x} komt eigenlijk niet voor: dan past er nog een twaalftal in. Het klopt wel: één twaalftal extra (1) + rest ${x - 12} (${restVal(x - 12)}) = ${1 + restVal(x - 12)}.`
          : "Jaardeel = twaalftal + rest, mod 7. Bijv. '95 = 84 (0) + rest 11 (6) = 6."}</div>` } }; })];
function flashcards(lid) {
  cur = null;
  const tab = lid === 'tabellen';
  const list = tab ? tableCards() : hardest(lid).map(x => ({ ...x, card: cardOf(x.part) })).filter(x => x.card);
  fc = { lid, tab, list, deck: shuffle(list), i: 0, round: 1, count: 1, shown: false, sub: {}, cur: null, prev: null };
  fc.cur = tab ? tabNext() : FC_TEMPO() ? tempoCard(list) : fc.deck[0];
  const title = tab ? 'Twaalftal + rest' : `${byId(lid).title}: je ${list.length} moeilijkste`, quizId = tab ? 'jaardeel' : lid;
  fc.deckName = tab ? 'Twaalftal + rest' : byId(lid).title;
  app.innerHTML = `
    <div class="bar"><button class="btn" id="back">← Overzicht</button>
      <div class="stats"><span>🃏 ${title}</span><span id="fcpos"></span></div>
      <button class="btn" data-go="${quizId}">Naar de quiz →</button></div>
    <div class="fcmix">${tab ? `<span>Welke kaarten</span><span id="fcmixseg">${fcMixSeg()}</span>` : ''}<span>Volgorde</span><span id="fcordseg">${fcOrdSeg()}</span></div>
    <div class="fc" id="fccard"></div>
    <div class="hint"><kbd>Spatie</kbd> of klik = omdraaien, nog een keer = volgende kaart · ${tab ? 'boven de kaart kies je welke kaarten' : 'na de laatste kaart wordt opnieuw geschud'} · <kbd>Esc</kbd> terug<br>
      ${tab ? 'Jaardeel = waarde van het twaalftal + waarde van de rest, mod 7. Zo tel je nooit meer dan 6 + 6 op.'
        : 'Gekozen op je tempo-score: wat je in de quiz het traagst of vaakst fout doet. Flashcards tellen zelf niet mee; de lijst verandert als het in de quiz beter gaat.'}</div>
    <details class="uitleg" style="margin-top:14px"><summary>Het hele lijstje met antwoorden</summary><div class="body">
      <table class="fclist"><tr><th>#</th><th>Soort</th><th>Vraag</th><th>Antwoord</th><th>Bedenktijd</th>${tab ? '' : '<th>Score</th>'}</tr>
      ${list.map((x, i) => `<tr id="fcrow${i}"><td>${i + 1}</td><td>${x.card.kind}</td><td><b>${x.card.short}</b></td><td>${x.card.ans}</td><td id="fct${i}">${fcTimeTxt(x.k)}</td>${tab ? '' : `<td>${x.it.m.toFixed(2)}</td>`}</tr>`).join('')}</table>
      <p class="muted" style="font-size:13px">Bedenktijd = gemiddelde tijd tot je de kaart omdraait (aantal keer bekeken).</p>
      ${tab ? '' : '<p class="muted" style="font-size:13px">Score = hoe traag je bent t.o.v. je gewone tempo in dit onderdeel (0 = normaal, 1,2 = altijd fout).</p>'}</div></details>`;

// Tabel-kaarten: verhouding twaalftal/rest via de schuif (S.fcRest = % rest-kaarten). Binnen elke soort een geschud stapeltje,
// zodat alle kaarten van die soort langskomen; nooit twee keer dezelfde achter elkaar.
const FC_MIX = [[0, 'Alleen twaalftal'], [25, 'Meer twaalftal'], [50, 'Half-half'], [75, 'Meer rest'], [100, 'Alleen rest']];
// Oude schuifwaarden (stappen van 10) afronden naar de dichtstbijzijnde knop
const fcRest = () => FC_MIX.map(m => m[0]).reduce((a, b) => Math.abs(b - (S.fcRest ?? 50)) < Math.abs(a - (S.fcRest ?? 50)) ? b : a);
const fcMixSeg = () => `<div class="seg">${FC_MIX.map(([v, n]) => `<button data-fcmix="${v}" class="${fcRest() === v ? 'on' : ''}">${n}</button>`).join('')}</div>`;
// Op tempo: kaarten waar je lang over nadenkt (bedenktijd t.o.v. je eigen gemiddelde in dit stapeltje) komen vaker,
// hooguit ~5× zo vaak als de snelste; nog niet bekeken kaarten krijgen een duwtje. Telt de recente tijden het zwaarst.
const FC_TEMPO = () => S.fcOrder === 'tempo';
const fcOrdSeg = () => `<div class="seg">${[['normal', 'Normaal'], ['tempo', 'Op tempo']].map(([k, n]) =>
  `<button data-fcord="${k}" class="${(S.fcOrder || 'normal') === k ? 'on' : ''}" title="${k === 'tempo' ? 'Vaker de kaarten waar je lang over nadenkt' : 'Alle kaarten even vaak'}">${n}</button>`).join('')}</div>`;
const fcEma = k => { const v = (S.fcStats || {})[k]; return v ? (v[3] ?? v[1] / v[0]) / 10 : null; };
function tempoCard(pool) {
  const known = pool.map(x => fcEma(x.k)).filter(x => x != null).map(Math.log).sort((a, b) => a - b);
  const B = known.length ? known[known.length >> 1] : 0;
  const cands = pool.length > 2 ? pool.filter(x => x !== fc.cur && x !== fc.prev) : pool.length > 1 ? pool.filter(x => x !== fc.cur) : pool;
  const ws = cands.map(x => { const e = fcEma(x.k); return Math.exp(LAMBDA * clip(e == null ? TP.beta : Math.log(e) - B, -1, 1)); });
  let u = Math.random() * ws.reduce((a, b) => a + b, 0);
  for (let i = 0; i < cands.length; i++) { u -= ws[i]; if (u <= 0) return cands[i]; }
  return cands[cands.length - 1];
}
function tabNext() {
  const p = fcRest() / 100, kind = p <= 0 ? 'tz' : p >= 1 ? 'tr' : Math.random() < p ? 'tr' : 'tz';
  const pool = fc.list.filter(x => x.k.startsWith(kind));
  if (FC_TEMPO()) return tempoCard(pool);
  let s = fc.sub[kind];
  if (!s || !s.length) { s = fc.sub[kind] = shuffle(pool); if (fc.cur && s[s.length - 1] === fc.cur && s.length > 1) [s[0], s[s.length - 1]] = [s[s.length - 1], s[0]]; }
  return s.pop();
}
function setFcMix(v, btn) {
  S.fcRest = v; save();
  document.getElementById('fcmixseg').innerHTML = fcMixSeg();
  if (btn) btn.blur();
  // Past de kaart die nog dicht ligt niet bij de keuze (bijv. een rest-kaart bij "Alleen twaalftal"), dan meteen een nieuwe
  const kind = fc.cur && fc.cur.k.slice(0, 2);

}
// Statistieken: elke omgedraaide kaart gaat het log in (Onderdeel "Flashcards", Goed = "Bekeken", Tijd = bedenktijd),
// en per kaart houden we in de voortgang [aantal, totale tijd in tienden, laatste tijd in tienden] bij.
const fcTimeTxt = k => { const v = (S.fcStats || {})[k]; return v ? `${(v[1] / v[0] / 10).toFixed(1)} s <span class="muted">(${v[0]}×)</span>` : '–'; };
function fcLog() {
  const t = (performance.now() - fc.t0) / 1000, c = fc.cur.card;
  if (fc.hidden || t < 0.2) return;                  // tabblad weg geweest of dubbelklik: niet meetellen
  logAttempt([stamp(), 'Flashcards', 'Flashcards: ' + fc.deckName, plain(`${c.ask} ${c.front}`), '', plain(String(c.ans)), 'Bekeken', t.toFixed(2)]);
  const v = (S.fcStats ||= {})[fc.cur.k] || [0, 0, 0], tt = Math.round(Math.min(t, 60) * 10);
  S.fcStats[fc.cur.k] = [v[0] + 1, v[1] + tt, tt, Math.round(v[0] ? 0.6 * (v[3] ?? v[1] / v[0]) + 0.4 * tt : tt)];   // [aantal, totaal, laatste, lopend gemiddelde] in tienden
  save();
  const i = fc.list.indexOf(fc.cur), cell = document.getElementById('fct' + i); if (cell) cell.innerHTML = fcTimeTxt(fc.cur.k);
}
document.addEventListener('visibilitychange', () => { if (document.hidden && fc) fc.hidden = true; });
const shuffle = arr => { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = rnd(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function fcShow() {
  const el = document.getElementById('fccard'); if (!el) return;
  if (!fc.list.length) { el.innerHTML = '<p class="muted">Nog geen gegevens: oefen eerst een paar rondes in de quiz.</p>'; return; }
  document.getElementById('fcpos').innerHTML = fc.tab || FC_TEMPO() ? `Kaart <b>${fc.count}</b>`
    : `Kaart <b>${fc.i + 1}</b>/${fc.deck.length}${fc.round > 1 ? ` · ronde ${fc.round}` : ''}`;
  const c = fc.cur.card;
  if (!fc.shown) { fc.t0 = performance.now(); fc.hidden = false; }
  el.innerHTML = `<div class="tag">${c.kind}</div><div class="ask">${c.ask}</div><div class="big">${c.front}</div>
    ${fc.shown ? `<div class="ans">${c.ans}</div><div class="fcback">${c.back}</div>`
      : '<p class="muted" style="margin-top:22px">Bedenk het antwoord · spatie of klik = omdraaien</p>'}`;
}
/** Spatie/klik: eerst omdraaien, daarna de volgende kaart; na de laatste opnieuw schudden (niet dezelfde kaart twee keer achter elkaar). */
function fcStep() {
  if (!fc || !fc.list.length) return;
  if (!fc.shown) { fc.shown = true; fcLog(); return fcShow(); }
  fc.shown = false;
  fc.prev = fc.cur; fc.count++;
  if (fc.tab) { fc.cur = tabNext(); return fcShow(); }
  if (FC_TEMPO()) { fc.cur = tempoCard(fc.list); return fcShow(); }
  if (++fc.i >= fc.deck.length) {
    const last = fc.deck[fc.deck.length - 1];
    do { fc.deck = shuffle(fc.list); } while (fc.list.length > 1 && fc.deck[0] === last);
    fc.i = 0; fc.round++;
  }
  fc.cur = fc.deck[fc.i];
  fcShow();
}

function showBanner() {
  const i = LEVELS.indexOf(cur.lvl), nx = LEVELS[i + 1];
  document.getElementById('banner').innerHTML = `<div class="banner"><span>🎉 ${cur.lvl.title} gehaald!</span>
    ${nx ? `<button class="btn primary" data-go="${nx.id}">Volgende: ${nx.title} →</button>` : ''}</div>`;
}
function refreshStats() {
  document.getElementById('streak').textContent = cur.streak;
  document.getElementById('dots').innerHTML = dots(cur.lvl.id);
  document.getElementById('avg').textContent = avgTime(cur.lvl.id);
}

// ---------- Events ----------
document.addEventListener('click', e => {
  const fcl = e.target.closest('[data-fc]'); if (fcl) return flashcards(fcl.dataset.fc);
  if (fc && document.getElementById('fccard')) {
    const b = e.target.closest('button');
    if (b && b.dataset.fcmix) return setFcMix(+b.dataset.fcmix, b);
    if (b && b.dataset.fcord) { S.fcOrder = b.dataset.fcord; save(); b.blur(); document.getElementById('fcordseg').innerHTML = fcOrdSeg(); return fcShow(); }
    if (!b && e.target.closest('#fccard')) return fcStep();
  }
  const t = e.target.closest('button');
  if (t && t.dataset.order) { S.order = t.dataset.order; save(); if (!cur) return home();
    document.getElementById('orderseg').innerHTML = orderSeg(); return cur.state === 'ask' ? ask() : undefined; }
  if (t && t.dataset.flash !== undefined) { S.flash = +t.dataset.flash; save(); if (!cur) return home();
    document.getElementById('flashseg').innerHTML = flashSeg(); return cur.state === 'ask' ? ask() : undefined; }
  if (t && t.dataset.diff) { S.diff = t.dataset.diff; save(); if (!cur) return home(); document.getElementById('diffseg').innerHTML = diffSeg(); cur.retry = []; return ask(); }
  // Tijdens de feedback gaat elke klik door naar de volgende vraag (behalve in de uitleg of op een navigatieknop)
  if (cur && cur.state === 'fb' && !(t && (t.id === 'back' || t.dataset.go)) && !e.target.closest('details')) return ask();
  if (!t) return;
  if (t.dataset.go) return start(t.dataset.go);
  if (t.dataset.range) { S.range = t.dataset.range; save(); return home(); }
  if (t.id === 'back') return home();
  if (t.id === 'nextq') return ask();
  if (t.id === 'csv') return downloadCsv();
  if (t.id === 'ghoff') { if (confirm('Ontkoppelen? Het token wordt van dit apparaat verwijderd.')) { GH = null; localStorage.removeItem(GHKEY); home(); } return; }
  if (t.id === 'ghsave') {
    const repo = document.getElementById('ghrepo').value.trim(), token = document.getElementById('ghtoken').value.trim(), msg = document.getElementById('ghmsg');
    if (!/^[\w.-]+\/[\w.-]+$/.test(repo) || !token) { msg.textContent = 'Vul repo (gebruiker/repo) en token in.'; return; }
    msg.textContent = 'Testen…';
    ghConnect(repo, token).then(boot).catch(err => { msg.textContent = 'Mislukt: ' + err.message; });
    return;
  }
  if (t.id === 'reset') { if (confirm('Alle voortgang wissen?')) { S.levels = {}; S.tempo = {}; S.tbase = {}; S.fcStats = {}; save(); home(); } return; }
  if (t.dataset.v !== undefined && cur) answer(+t.dataset.v);
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (!cur) return;
  if (cur.state === 'fb') return ask();
  const raw = document.getElementById('num').value.trim();
  if (/^\d+$/.test(raw)) answer(+raw);
});
const peek = on => { const b = document.querySelector('#quiz .big'); if (b) b.classList.toggle('peek', on); };
document.addEventListener('keyup', e => { if (e.key.toLowerCase() === 'q') peek(false); });
window.addEventListener('blur', () => peek(false));
document.addEventListener('keydown', e => {
  if (!cur && fc && document.getElementById('fccard') && !e.metaKey && !e.ctrlKey && !e.altKey) {
    const k = e.key.toLowerCase();
    if (k === 'escape') return home();
    if (k === ' ' || k === 'enter' || k === 'arrowright') { e.preventDefault(); if (!e.repeat) fcStep(); }
    return;
  }
  if (!cur || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'Escape') return home();
  if (e.key.toLowerCase() === 'q' && cur.state === 'ask') { e.preventDefault(); return peek(true); }  // Q vasthouden = getal weer tonen
  if (cur.state === 'fb') { e.preventDefault(); if (!e.repeat) ask(); return; }  // elke toets = volgende vraag
  if (cur.q.choices) {
    const ch = cur.q.choices.find(c => c.key === e.key.toLowerCase());
    if (ch) { e.preventDefault(); answer(ch.v); }
  }
});

async function boot() {
  if (GH) {
    app.innerHTML = '<p class="muted">Voortgang laden…</p>';
    try {
      const f = await ghRead('voortgang.json');
      if (f.text) S = Object.assign(S, JSON.parse(f.text));        // GitHub is leidend
      else if (Object.keys(S.levels).length) stateDirty = true;    // eerste keer: lokale voortgang uploaden
      syncErr = null;
    } catch (e) { syncErr = e.message || 'geen verbinding'; }
    home();
  } else if (SERVER) {
    fetch('/state').then(r => r.json()).then(d => {
      if (d && d.levels) S = Object.assign(S, d);   // schijf is leidend
      else if (Object.keys(S.levels).length) save(); // eerste keer: bestaande voortgang naar schijf
    }).catch(() => { diskOk = false; }).finally(home);
  } else home();
}
document.addEventListener('visibilitychange', () => { if (document.hidden && GH) flush(); });
boot();
</script>
</body>
